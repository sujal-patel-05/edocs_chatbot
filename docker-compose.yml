version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edocs_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_RELEASE=${DEFAULT_RELEASE:-2023.00}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-27b}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - POSTGRES_DSN=postgresql://edocs:edocs@postgres:5432/edocs
      - QDRANT_URL=http://qdrant:6333
      - HOSTED_LLM_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./prompts:/app/prompts
      - ./web:/app/web
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: edocs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edocs
      POSTGRES_PASSWORD: edocs
      POSTGRES_DB: edocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/edocs/store/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edocs -d edocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: edocs_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: edocs_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    profiles:
      - local-llm

volumes:
  postgres_data:
  qdrant_data:
  ollama_models:
