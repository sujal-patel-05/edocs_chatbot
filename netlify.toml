# Netlify Configuration for Symitar eDocs Assistant

[build]
  publish = "web"

# Proxy API requests to your Render backend
[[redirects]]
  from = "/api/*"
  to = "https://edocs-api.onrender.com/api/:splat"
  status = 200
  force = true

# Serve reference.html for root and SPA routes
[[redirects]]
  from = "/*"
  to = "/reference.html"
  status = 200
